<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sakura Asian Kitchen</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg-deep: #0e0c0a;
    --bg-panel: #17130f;
    --bg-panel-2: #1e1813;
    --line: #2c241c;
    --gold: #c9a15a;
    --gold-soft: #e2c48a;
    --red: #b3543f;
    --text: #ece5da;
    --text-dim: #9a8f80;
    --bubble-user: linear-gradient(135deg, #7d2f22, #b3543f);
    --bubble-bot: #1e1813;
    --shadow: 0 20px 60px rgba(0, 0, 0, 0.55);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    font-family: 'Inter', system-ui, sans-serif;
    color: var(--text);
    background:
      radial-gradient(1200px 600px at 80% -10%, rgba(201, 161, 90, 0.10), transparent 60%),
      radial-gradient(900px 500px at -10% 110%, rgba(179, 84, 63, 0.12), transparent 55%),
      var(--bg-deep);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .app {
    width: 100%;
    max-width: 760px;
    height: min(88vh, 860px);
    background: var(--bg-panel);
    border: 1px solid var(--line);
    border-radius: 22px;
    box-shadow: var(--shadow);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ── Header ── */
  header {
    position: relative;
    padding: 26px 30px 22px;
    border-bottom: 1px solid var(--line);
    background:
      linear-gradient(180deg, rgba(201, 161, 90, 0.06), transparent),
      var(--bg-panel-2);
  }
  header::after {
    content: "";
    position: absolute; left: 30px; right: 30px; bottom: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
    opacity: 0.5;
  }
  .brand { display: flex; align-items: center; gap: 14px; }
  .mon {
    width: 46px; height: 46px; flex: none;
    border-radius: 50%;
    display: grid; place-items: center;
    background: radial-gradient(circle at 50% 35%, #241c15, #0f0b08);
    border: 1px solid var(--gold);
    box-shadow: inset 0 0 12px rgba(201,161,90,0.25);
  }
  .mon svg { width: 26px; height: 26px; }
  .titles h1 {
    margin: 0;
    font-family: 'Cormorant Garamond', serif;
    font-weight: 600;
    font-size: 26px;
    letter-spacing: 0.5px;
    color: var(--gold-soft);
  }
  .titles p {
    margin: 2px 0 0;
    font-size: 12.5px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--text-dim);
  }

  /* ── Chat area ── */
  .chat {
    flex: 1;
    overflow-y: auto;
    padding: 26px 26px 8px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    scroll-behavior: smooth;
  }
  .chat::-webkit-scrollbar { width: 8px; }
  .chat::-webkit-scrollbar-thumb { background: #2c241c; border-radius: 8px; }

  .row { display: flex; }
  .row.user { justify-content: flex-end; }
  .row.bot { justify-content: flex-start; }

  .bubble {
    max-width: 76%;
    padding: 13px 17px;
    border-radius: 16px;
    font-size: 14.5px;
    line-height: 1.55;
    white-space: pre-wrap;
    word-wrap: break-word;
    animation: rise 0.28s ease;
  }
  .row.user .bubble {
    background: var(--bubble-user);
    color: #fff;
    border-bottom-right-radius: 5px;
    box-shadow: 0 6px 20px rgba(179, 84, 63, 0.28);
  }
  .row.bot .bubble {
    background: var(--bubble-bot);
    border: 1px solid var(--line);
    border-bottom-left-radius: 5px;
    color: var(--text);
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* typing */
  .typing { display: flex; gap: 5px; padding: 4px 2px; }
  .typing span {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--gold); opacity: 0.6;
    animation: blink 1.2s infinite ease-in-out;
  }
  .typing span:nth-child(2) { animation-delay: 0.2s; }
  .typing span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes blink { 0%, 80%, 100% { opacity: 0.25; transform: translateY(0);} 40% { opacity: 1; transform: translateY(-3px);} }

  /* ── Suggestion chips ── */
  .chips {
    display: flex; flex-wrap: wrap; gap: 8px;
    padding: 4px 26px 14px;
  }
  .chip {
    font-size: 12.5px;
    color: var(--gold-soft);
    background: rgba(201, 161, 90, 0.07);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 7px 14px;
    cursor: pointer;
    transition: all 0.18s ease;
  }
  .chip:hover { background: rgba(201, 161, 90, 0.16); border-color: var(--gold); }

  /* ── Input ── */
  .composer {
    padding: 16px 20px 20px;
    border-top: 1px solid var(--line);
    background: var(--bg-panel-2);
    display: flex;
    gap: 12px;
    align-items: flex-end;
  }
  .composer textarea {
    flex: 1;
    resize: none;
    max-height: 130px;
    min-height: 26px;
    background: var(--bg-deep);
    border: 1px solid var(--line);
    border-radius: 14px;
    color: var(--text);
    font-family: inherit;
    font-size: 14.5px;
    line-height: 1.5;
    padding: 12px 15px;
    outline: none;
    transition: border-color 0.2s ease;
  }
  .composer textarea:focus { border-color: var(--gold); }
  .composer textarea::placeholder { color: #6f6558; }

  .send {
    flex: none;
    width: 46px; height: 46px;
    border-radius: 14px;
    border: none;
    cursor: pointer;
    background: linear-gradient(135deg, var(--gold), #a9823f);
    display: grid; place-items: center;
    transition: transform 0.15s ease, filter 0.15s ease;
  }
  .send:hover { filter: brightness(1.08); }
  .send:active { transform: scale(0.94); }
  .send:disabled { opacity: 0.45; cursor: default; }
  .send svg { width: 20px; height: 20px; }

  .row.error .bubble { border-color: var(--red); color: #e7a89b; }
</style>
</head>
<body>
  <div class="app">
    <header>
      <div class="brand">
        <div class="mon">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 3c1.6 2.2 1.6 4-.2 5.6C10 10.2 9.8 12 11 13.6c-2.4-.6-3.6-2.4-3.2-4.6.3-1.8 1.6-3.2 4.2-6z" fill="#c9a15a"/>
            <path d="M12 21c-3.9 0-7-1.6-7-3.6 0-1.3 1.4-2.5 3.6-3.1.7 1.4 2 2 3.4 2s2.7-.6 3.4-2c2.2.6 3.6 1.8 3.6 3.1 0 2-3.1 3.6-7 3.6z" fill="#b3543f"/>
          </svg>
        </div>
        <div class="titles">
          <h1>Sakura Asian Kitchen</h1>
          <p>Reservations &middot; Menu &middot; Hours</p>
        </div>
      </div>
    </header>

    <div class="chat" id="chat"></div>

    <div class="chips" id="chips">
      <div class="chip">What are your opening hours?</div>
      <div class="chip">Show me the spicy dishes</div>
      <div class="chip">Any vegan options?</div>
      <div class="chip">Book a table for 2 tomorrow at 8pm</div>
    </div>

    <div class="composer">
      <textarea id="input" rows="1" placeholder="Ask about the menu, hours, or book a table..."></textarea>
      <button class="send" id="send" title="Send">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M3.4 20.4 21 12 3.4 3.6 3.4 10l12 2-12 2 0 6.4z" fill="#161009"/>
        </svg>
      </button>
    </div>
  </div>

<script>
  const chat = document.getElementById('chat');
  const input = document.getElementById('input');
  const sendBtn = document.getElementById('send');
  const chips = document.getElementById('chips');

  function addBubble(text, who) {
    const row = document.createElement('div');
    row.className = 'row ' + who;
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.textContent = text;
    row.appendChild(bubble);
    chat.appendChild(row);
    chat.scrollTop = chat.scrollHeight;
    return row;
  }

  function addTyping() {
    const row = document.createElement('div');
    row.className = 'row bot';
    row.innerHTML = '<div class="bubble"><div class="typing"><span></span><span></span><span></span></div></div>';
    chat.appendChild(row);
    chat.scrollTop = chat.scrollHeight;
    return row;
  }

  async function send(text) {
    text = (text || input.value).trim();
    if (!text) return;
    input.value = '';
    autoGrow();
    addBubble(text, 'user');
    sendBtn.disabled = true;
    const typing = addTyping();

    try {
      const res = await fetch('/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: text })
      });
      const data = await res.json();
      typing.remove();
      if (data.reply) {
        addBubble(data.reply, 'bot');
      } else {
        addBubble(data.error || 'Something went wrong.', 'bot error');
      }
    } catch (e) {
      typing.remove();
      addBubble('Could not reach the server. Is it running?', 'bot error');
    } finally {
      sendBtn.disabled = false;
      input.focus();
    }
  }

  function autoGrow() {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 130) + 'px';
  }

  input.addEventListener('input', autoGrow);
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
  });
  sendBtn.addEventListener('click', () => send());
  chips.addEventListener('click', (e) => {
    if (e.target.classList.contains('chip')) send(e.target.textContent);
  });

  addBubble('Welcome to Sakura Asian Kitchen. I can help you explore the menu, check our hours, or book a table. What would you like?', 'bot');
  input.focus();
</script>
</body>
</html>
